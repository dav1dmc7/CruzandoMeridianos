name: Travel Intelligence

on:
  push:
    branches: [main]
    paths:
      - scripts/monitor-travel-intelligence.mjs
      - scripts/travel-intelligence.sources.mjs
      - .github/workflows/travel-intelligence.yml
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: travel-intelligence
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0

      - name: Monitor official traveler information
        run: node scripts/monitor-travel-intelligence.mjs

      - name: Commit generated travel intelligence
        run: |
          git config user.name "Cruzando Meridianos Travel Intelligence"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/live/travel-intelligence.generated.ts
          if git diff --cached --quiet; then
            echo "No meaningful traveler-intelligence changes detected."
            exit 0
          fi
          git commit -m "chore: refresh travel intelligence"
          git push
