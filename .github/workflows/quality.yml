name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Astro check
        run: npm run check

      - name: SEO architecture audit
        run: npm run audit:seo

      - name: Accessibility architecture audit
        run: npm run audit:accessibility

      - name: Travel intelligence rule tests
        run: npm run audit:travel-intelligence-rules

      - name: Internal link audit
        run: npm run audit:links

      - name: Analytics event audit
        run: npm run audit:analytics

      - name: Guide registry audit
        run: npm run audit:guides

      - name: Travel resource audit
        run: npm run audit:travel-resources

      - name: Copy consistency audit
        run: npm run audit:copy

      - name: Asset weight audit
        run: npm run audit:assets

      - name: Travel intelligence audit
        run: npm run audit:travel-intelligence

      - name: Production build
        run: npm run build
