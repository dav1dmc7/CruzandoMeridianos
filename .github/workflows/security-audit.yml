name: Security audit

on:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/security-audit.yml
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        continue-on-error: true
        run: npm audit --omit=dev --json > audit-production.json

      - name: Audit all dependencies
        continue-on-error: true
        run: npm audit --json > audit-all.json

      - name: Summarize and enforce production security gate
        run: |
          node - <<'NODE'
          const fs = require('fs');

          const production = JSON.parse(fs.readFileSync('audit-production.json', 'utf8'));
          const all = JSON.parse(fs.readFileSync('audit-all.json', 'utf8'));

          for (const [file, data] of [
            ['audit-production.json', production],
            ['audit-all.json', all],
          ]) {
            console.log(`\n=== ${file} ===`);
            console.log(JSON.stringify(data.metadata?.vulnerabilities ?? {}, null, 2));
            for (const [name, advisory] of Object.entries(data.vulnerabilities ?? {})) {
              console.log(`\n${name}`);
              console.log(`severity: ${advisory.severity}`);
              console.log(`range: ${advisory.range}`);
              console.log(`fixAvailable: ${JSON.stringify(advisory.fixAvailable)}`);
              for (const via of advisory.via ?? []) {
                if (typeof via === 'object') {
                  console.log(`title: ${via.title}`);
                  console.log(`url: ${via.url}`);
                }
              }
            }
          }

          const productionVulns = production.metadata?.vulnerabilities ?? {};
          const blocking = ['high', 'critical'].filter(
            (severity) => Number(productionVulns[severity] ?? 0) > 0,
          );

          if (blocking.length > 0) {
            console.error(`\nSecurity gate failed: production dependencies contain ${blocking.join(' and ')} severity vulnerabilities.`);
            process.exit(1);
          }

          console.log('\nSecurity gate passed: no high or critical production vulnerabilities detected.');
          NODE
