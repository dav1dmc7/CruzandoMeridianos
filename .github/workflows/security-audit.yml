name: Security audit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/security-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        continue-on-error: true
        run: npm audit --omit=dev --json > audit-production.json

      - name: Audit all dependencies
        continue-on-error: true
        run: npm audit --json > audit-all.json

      - name: Summarize audit
        run: |
          node - <<'NODE'
          const fs = require('fs');
          for (const file of ['audit-production.json', 'audit-all.json']) {
            const data = JSON.parse(fs.readFileSync(file, 'utf8'));
            console.log(`\n=== ${file} ===`);
            console.log(JSON.stringify(data.metadata?.vulnerabilities ?? {}, null, 2));
            for (const [name, advisory] of Object.entries(data.vulnerabilities ?? {})) {
              console.log(`\n${name}`);
              console.log(`severity: ${advisory.severity}`);
              console.log(`range: ${advisory.range}`);
              console.log(`fixAvailable: ${JSON.stringify(advisory.fixAvailable)}`);
              for (const via of advisory.via ?? []) {
                if (typeof via === 'object') {
                  console.log(`title: ${via.title}`);
                  console.log(`url: ${via.url}`);
                }
              }
            }
          }
          NODE
