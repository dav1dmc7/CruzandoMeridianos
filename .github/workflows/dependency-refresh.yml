name: Refresh dependencies

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dependency-refresh.yml
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: npm

      - name: Refresh locked dependencies
        run: |
          npm install astro@7.3.2 @astrojs/cloudflare@14.3.1 @astrojs/sitemap@3.7.4 wrangler@4.131.2 --package-lock-only --ignore-scripts
          npm update --package-lock-only --ignore-scripts

      - name: Commit refreshed dependencies
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git pull --rebase --autostash origin main
          git commit -m "chore(deps): refresh locked dependencies [skip ci]"
          git push origin HEAD:main

      - name: Validate refreshed main with Quality workflow
        run: gh workflow run quality.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
